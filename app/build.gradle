plugins {
    id 'com.android.application' version '8.2.0'
}

android {
    namespace 'com.arcadehub.engine'
    compileSdk 34 

    defaultConfig {
        applicationId "com.arcadehub.engine"
        minSdk 24 
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17" 
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1" 
        }
    }
}